services:
  db:
    image: postgres:16-alpine
    container_name: ck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ck
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: choukaguya
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]

  app:
    build: .
    image: choukaguya-app:latest
    container_name: ck-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ck:${DB_PASSWORD}@db:5432/choukaguya
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://choukaguya.cn
      UPLOAD_DIR: /app/uploads
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - uploads:/app/uploads
    depends_on: [db]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/site/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal: